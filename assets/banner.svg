<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic / Animated Background Network Grid & Glowing Waves -->
  <g opacity="0.25">
    <path d="M 0 80 Q 300 20 600 80 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M 0 80 Q 300 20 600 80 T 1200 80; M 0 80 Q 300 140 600 80 T 1200 80; M 0 80 Q 300 20 600 80 T 1200 80" />
    </path>
    <path d="M 0 220 Q 400 280 800 200 T 1200 240" fill="none" stroke="#8b5cf6" stroke-width="1.5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0 220 Q 400 280 800 200 T 1200 240; M 0 220 Q 400 160 800 240 T 1200 200; M 0 220 Q 400 280 800 200 T 1200 240" />
    </path>
  </g>

  <!-- Dynamic Pulsing Nodes (Background Ambient Layer) -->
  <g filter="url(#glow-filter)" opacity="0.6">
    <circle cx="150" cy="70" r="6" fill="#38bdf8">
      <animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="90" r="8" fill="#8b5cf6">
      <animate attributeName="r" values="6;11;6" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="240" r="5" fill="#ec4899">
      <animate attributeName="r" values="3;7;3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="250" r="7" fill="#06b6d4">
      <animate attributeName="r" values="5;9;5" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Ambient Dynamic Floating Feature Pills (Semi-transparent in background layer) -->
  <g opacity="0.4" transform="translate(0, 0)">
    <!-- Pill 1: Digital SOPs -->
    <rect x="70" y="30" width="130" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 6; 0 0" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="135" y="51" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Digital SOPs</text>

    <!-- Pill 2: AI Copilots -->
    <rect x="1000" y="35" width="130" height="32" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="1065" y="56" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🤖 AI Copilots</text>

    <!-- Pill 3: CMMS & EAM -->
    <rect x="80" y="250" width="140" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -5; 0 0" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <text x="150" y="271" fill="#67e8f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🔧 CMMS &amp; Assets</text>

    <!-- Pill 4: Frontline Ops -->
    <rect x="980" y="245" width="145" height="32" rx="16" fill="#1e293b" stroke="#ec4899" stroke-width="1">
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 5; 0 0" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <text x="1052" y="266" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🏭 Frontline Ops</text>
  </g>

  <!-- FOREGROUND TEXT LAYER (Ensures Title & Subtitle remain 100% visible & unblocked) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="500" y="60" width="200" height="28" rx="14" fill="url(#cyan-glow)" opacity="0.9"/>
    <text x="600" y="79" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">INDUSTRY 4.0 ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="145" fill="url(#title-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="-0.5" filter="drop-shadow(0px 4px 12px rgba(0,0,0,0.8))">
      Awesome Connected Worker Platform
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Curated SaaS Products &amp; Open-Source Tools for Digital Work Instructions, CMMS &amp; Frontline Enablement
    </text>

    <!-- Live Status Indicator -->
    <g transform="translate(480, 220)">
      <rect x="0" y="0" width="240" height="30" rx="15" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
      <circle cx="20" cy="15" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="130" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Updated for 2026 • Verified List</text>
    </g>
  </g>
</svg>
